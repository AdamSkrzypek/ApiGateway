spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8080/eureka/}
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=true

# Dev-only: faster eviction feedback when manually testing LB failover.
# NOT a production setting (self-preservation guards against network-partition false positives).
eureka.server.enable-self-preservation=${EUREKA_SELF_PRESERVATION:false}
eureka.server.eviction-interval-timer-in-ms=${EUREKA_EVICTION_INTERVAL_MS:5000}

management.endpoints.web.exposure.include=health

#ORDER_SERVICE#

order-service.base-url=lb://order-service

order-service.endpoints.get-order.path=/v1/api/orders/{id}
order-service.endpoints.get-order.method=GET

order-service.endpoints.get-orders.path=/v1/api/orders
order-service.endpoints.get-orders.method=GET

order-service.endpoints.create-order.path=/v1/api/orders
order-service.endpoints.create-order.method=POST

order-service.endpoints.cancel-order.path=/v1/api/orders/{id}/cancel
order-service.endpoints.cancel-order.method=PUT

order-service.endpoints.update-order.path=/v1/api/orders/{id}/update
order-service.endpoints.update-order.method=PATCH

order-service.endpoints.delete-order.path=/v1/api/orders/{id}
order-service.endpoints.delete-order.method=DELETE

order-service.endpoints.restore-order.path=/v1/api/orders/{id}/restore
order-service.endpoints.restore-order.method=PUT

order-service.endpoints.get-order-versions.path=/v1/api/orders/{id}/versions
order-service.endpoints.get-order-versions.method=GET

#################################################################################


